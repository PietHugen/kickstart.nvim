---
# Install once per clone: `prek install` (or `pre-commit install`); installs all three hook types.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]   # gitlint + commit-body-length run at commit-msg; slow checks opt into pre-push
# Generated by `openspec update`, which overwrites any edits; don't lint or fix them.
exclude: ^\.(claude|opencode)/(skills/openspec-|commands/opsx)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
      - id: check-symlinks
      - id: forbid-submodules

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.yaml"]

  # Lua formatting per .stylua.toml (mirrors .github/workflows/stylua.yml); same as
  # conform's format-on-save, so it only catches files edited outside Neovim.
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.6.0
    hooks:
      - id: stylua-github

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.0
    hooks:
      - id: gitlint

  - repo: local
    hooks:
      - id: commit-body-length
        name: commit body must be at most 3 lines (rationale belongs in the doc)
        entry: scripts/check-commit-body-length.sh
        language: script
        stages: [commit-msg]

      # Project-specific slow checks (tests, type checks, builds, ansible-lint) go
      # here at pre-push. Template; uncomment and adapt:
      #
      # - id: tests
      #   name: tests
      #   # language: system runs with the git client's env, not your shell's:
      #   # - `mise exec --` because lazygit/IDEs may not have mise activated;
      #   # - LC_ALL because lazygit runs git with LC_ALL=C, which Python tools
      #   #   like Ansible reject. C.UTF-8 exists on macOS and most Linux images.
      #   entry: env LC_ALL=C.UTF-8 mise exec -- pytest
      #   language: system
      #   stages: [pre-push]
      #   pass_filenames: false
      #   always_run: true
